name: aspire_task_pro_frontend
description: Aspire Holidays Task & Team Management Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  record: ^7.1.1
  audioplayers: ^6.8.1
  speech_to_text: ^7.4.0
  table_calendar: ^3.1.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  image_picker: ^1.2.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
